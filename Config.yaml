project:
  name: "brain-tumor-xai"
  seed: 42

paths:
  raw_data_dir: "data/raw"

data:
  image_size: 224
  num_workers: 0       # Set to 0 for Windows compatibility to avoid multiprocessing freezing!
  pin_memory: true

augmentation:
  horizontal_flip_prob: 0.5
  rotation_limit: 15
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

model:
  name: "resnet50"
  pretrained: true
  num_classes: 4

training:
  batch_size: 32
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  save_dir: "models/saved_weights"