project:
  name: "brain-tumor-xai-mlops"
  description: "Explainable AI & MLOps pipeline for Brain Tumor MRI Classification"
  seed: 42
  device: "auto"

paths:
  raw_data_dir: "data/raw/"
  processed_data_dir: "data/processed/"
  model_checkpoint_dir: "models/saved_weights/"
  logs_dir: "logs/"

data:
  image_size: 224
  class_names:
    - glioma_tumor
    - meningioma_tumor
    - no_tumor
    - pituitary_tumor
  num_workers: 0
  pin_memory: true

augmentation:
  horizontal_flip_prob: 0.5
  vertical_flip_prob: 0.2
  rotation_limit: 15
  normalize:
    mean: [0.485, 0.456, 0.406]
    std:  [0.229, 0.224, 0.225]

model:
  architecture: "resnet50"
  pretrained: true
  num_classes: 4

training:
  batch_size: 32
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001

api:
  host: "0.0.0.0"
  port: 7860
  reload: false